; PHP configuration for the desktop app (FrankenPHP binary in desktop/bin).
; Loaded via PHPRC, set by desktop/start / desktop/start.ps1.

; Relative to the directory containing frankenphp.exe.
extension_dir = "ext"

extension = curl
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sodium
extension = sqlite3
extension = zip

date.timezone = Europe/Paris
